services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s

  mongo:
    image: mongo:6.0
    container_name: mongodb
    ports:
      - "27017:27017"

  spark:
    image: apache/spark:3.5.1
    container_name: spark
    hostname: spark
    environment:
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "8080:8080"
      - "7077:7077"
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark

  spark-worker:
    image: apache/spark:3.5.1
    container_name: spark-worker
    depends_on:
      - spark
    environment:
      SPARK_NO_DAEMONIZE: "true"
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark:7077

  # Reads Kafka + writes Mongo via Spark cluster (driver here, executors on workers).
  spark-streaming:
    image: apache/spark:3.5.1
    container_name: spark-streaming
    # Named volume at /checkpoints is root-owned; driver needs to create checkpoint subdirs (local dev only).
    user: "0:0"
    # Default $HOME is not writable in this image; Ivy needs a writable home for --packages.
    environment:
      HOME: /tmp/spark-home
    depends_on:
      kafka:
        condition: service_healthy
      spark:
        condition: service_started
      spark-worker:
        condition: service_started
      mongo:
        condition: service_started
    volumes:
      - ./src/spark_jobs:/jobs
      - streaming-checkpoints:/checkpoints
    command:
      - /bin/bash
      - -c
      - >-
        mkdir -p /tmp/spark-home/.ivy2/cache /tmp/spark-home/.ivy2/jars /checkpoints/traffic-kafka &&
        exec /opt/spark/bin/spark-submit
        --master spark://spark:7077
        --deploy-mode client
        --conf spark.jars.ivy=/tmp/spark-home/.ivy2
        --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1,org.mongodb.spark:mongo-spark-connector_2.12:10.3.0
        /jobs/spark_app.py
    restart: unless-stopped

  superset:
    image: apache/superset:3.0.1
    container_name: superset
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: "superset_secret"

  producer:
    build: ./src/producer
    container_name: producer
    depends_on:
      kafka:
        condition: service_healthy
      spark-streaming:
        condition: service_started
    volumes:
      - ./data:/data
    restart: unless-stopped

volumes:
  streaming-checkpoints: